<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Handa Ka Ba{% endblock %}</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2933;--muted:#6b7785;--primary:#d9480f;--primary-d:#b53a0a;--border:#dde2e8;--ok:#2b8a3e;--err:#c92a2a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
nav{background:#1f2933;color:#fff;display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;flex-wrap:wrap}
nav .brand{font-weight:700;font-size:1.1rem;margin-right:auto;color:#fff;text-decoration:none}
nav a{color:#e4e7eb;text-decoration:none}nav a:hover{color:#fff}
nav form{margin:0}nav button{background:none;border:1px solid #52606d;color:#e4e7eb;padding:.3rem .8rem;border-radius:6px;cursor:pointer}
main{max-width:900px;margin:1.5rem auto;padding:0 1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1rem}
.narrow{max-width:460px;margin:2rem auto}
h1,h2{margin-top:0}.muted{color:var(--muted)}
.msg{padding:.7rem 1rem;border-radius:8px;margin-bottom:.75rem;border:1px solid}
.msg.success{background:#ebfbee;border-color:#b2f2bb;color:var(--ok)}.msg.error{background:#fff5f5;border-color:#ffc9c9;color:var(--err)}
.field{margin-bottom:1rem}.field label{display:block;font-weight:600;margin-bottom:.25rem}
.field input,.field select{width:100%;padding:.55rem;border:1px solid var(--border);border-radius:6px;font-size:1rem}
.field .help{font-size:.82rem;color:var(--muted)}.field .err{color:var(--err);font-size:.88rem}
.btn{display:inline-block;background:var(--primary);color:#fff;border:0;padding:.6rem 1.2rem;border-radius:6px;font-size:1rem;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--primary-d)}.btn.alt{background:#e4e7eb;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}
.stat{font-size:2rem;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--border)}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#e4e7eb}
.badge{background:#fff4e6;color:var(--primary-d);padding:.15rem .6rem;border-radius:99px;font-size:.8rem;font-weight:600}
</style>
</head>
<body>
<nav>
  <a class="brand" href="{% url 'accounts:home' %}">&#9969; Handa Ka Ba</a>
  {% if user.is_authenticated %}
    {% if user.profile.role == 'admin' %}
      <a href="{% url 'accounts:admin_dashboard' %}">Admin Dashboard</a>
    {% else %}
      <a href="{% url 'accounts:household_dashboard' %}">My Go-Bag</a>
    {% endif %}
    <a href="{% url 'accounts:profile' %}">Profile</a>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
  {% else %}
    <a href="{% url 'accounts:login' %}">Log in</a>
    <a href="{% url 'accounts:register' %}">Register</a>
  {% endif %}
</nav>
<main>
  {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
