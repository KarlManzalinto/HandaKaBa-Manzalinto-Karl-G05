{% if form.non_field_errors %}<div class="msg error full" style="grid-column:1/-1">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field {% if field.name in full_fields or not grid %}full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
