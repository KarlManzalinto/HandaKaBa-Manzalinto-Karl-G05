{% extends "base.html" %}
{% block title %}Edit Profile | Handa Ka Ba{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    {% include "_form.html" with form=user_form %}
    {% include "_form.html" with form=profile_form %}
    <button class="btn" type="submit">Save changes</button>
    <a class="btn alt" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
