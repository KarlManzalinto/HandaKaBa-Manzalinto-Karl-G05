{% extends "base.html" %}
{% block title %}Log in | Handa Ka Ba{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post" novalidate>{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "_form.html" %}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
